name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff snakefmt
      - run: ruff check workflow/rules/helpers.py
      - run: snakefmt --check workflow/

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bcftools 1.21
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libbz2-dev liblzma-dev zlib1g-dev
          curl -fsSL https://github.com/samtools/bcftools/releases/download/1.21/bcftools-1.21.tar.bz2 | tar -xj -C /tmp
          cd /tmp/bcftools-1.21 && ./configure --disable-libcurl && make -j"$(nproc)" && sudo make install
      - run: pip install pytest pandas pyyaml jsonschema snakemake
      - run: pytest tests/ -v
